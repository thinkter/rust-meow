name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: rust-meow-linux-x86_64
            portable: true
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: rust-meow-linux-arm64
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: rust-meow-macos-x86_64
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: rust-meow-macos-arm64
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: rust-meow-windows-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm --dir tauri install --frozen-lockfile

      - name: Build native Go sidecar
        run: node scripts/release/prepare-sidecar.mjs --target ${{ matrix.target }}

      - name: Build installers
        env:
          # An ad-hoc signature keeps Apple Silicon downloads launchable without
          # requiring repository signing secrets. It is ignored on other hosts.
          APPLE_SIGNING_IDENTITY: ${{ contains(matrix.target, 'apple-darwin') && '-' || '' }}
          # linuxdeploy can fail while re-stripping the already stripped Rust
          # executable and static Go sidecar. System libraries are pre-stripped.
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
        run: >-
          pnpm --dir tauri tauri build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          --config src-tauri/tauri.bundle.conf.json

      - name: Package portable Linux x86_64 binaries
        if: matrix.portable == true
        shell: bash
        run: |
          version=$(node -p "require('./tauri/src-tauri/tauri.conf.json').version")
          archive_root="tauri/src-tauri/target/${{ matrix.target }}/release/bundle/archive"
          payload_root="$archive_root/rust-meow"
          mkdir -p "$payload_root"
          install -m 0755 \
            "tauri/src-tauri/target/${{ matrix.target }}/release/rust-meow" \
            "$payload_root/rust-meow"
          install -m 0755 \
            "tauri/src-tauri/binaries/rust-meow-backend-${{ matrix.target }}" \
            "$payload_root/rust-meow-backend"
          tar -czf "$archive_root/rust-meow_${version}_linux_x86_64.tar.gz" \
            -C "$archive_root" rust-meow

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/archive/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          pushd release-assets >/dev/null
          mapfile -d '' relative_assets < <(find . -type f -print0 | sort -z)
          if (( ${#relative_assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          sha256sum "${relative_assets[@]}" > SHA256SUMS.txt
          popd >/dev/null

          mapfile -d '' assets < <(find release-assets -type f -print0)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes \
              --verify-tag \
              --title "Rust Meow $RELEASE_TAG"
          fi
